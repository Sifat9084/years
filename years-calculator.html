<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Years Calculator</title>
<style>
  :root {
    --panel-black: #0d0d0f;
    --glow-pink: #ff2e88;
    --glow-blue: #3d5bff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: radial-gradient(ellipse at top, #b9a7d9 0%, #e7e0f2 35%, #ffffff 70%);
    display: flex;
    justify-content: center;
    padding: 40px 16px 80px;
  }
  .card {
    width: 100%;
    max-width: 460px;
    text-align: center;
  }
  h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: 900;
    font-style: italic;
    font-size: clamp(30px, 8vw, 46px);
    letter-spacing: 1px;
    color: #17142b;
    margin: 10px 0 40px;
    position: relative;
  }
  .field-wrap {
    position: relative;
    margin: 0 auto 26px;
    max-width: 380px;
  }
  .field {
    background: var(--panel-black);
    border-radius: 22px;
    padding: 22px 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.25);
  }
  .field label {
    display: block;
    color: #fff;
    font-weight: 800;
    font-size: 22px;
    margin-bottom: 12px;
  }
  .field input[type="date"] {
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: none;
    font-size: 16px;
    font-weight: 600;
    background: #fff;
    color: #111;
  }
  .result-wrap {
    position: relative;
    max-width: 380px;
    margin: 0 auto;
  }
  .result-field {
    background: var(--panel-black);
    border-radius: 26px;
    padding: 26px 22px 22px;
    box-shadow:
      -30px 10px 45px -10px rgba(255,46,136,0.55),
      30px 10px 45px -10px rgba(61,91,255,0.55);
  }
  .result-field h2 {
    color: #fff;
    font-weight: 900;
    font-size: 44px;
    margin: 0 0 14px;
    letter-spacing: 1px;
  }
  .result-values {
    display: flex;
    justify-content: space-around;
    gap: 8px;
    flex-wrap: wrap;
  }
  .result-values div {
    color: #fff;
  }
  .result-values .num {
    font-size: 26px;
    font-weight: 800;
    display: block;
  }
  .result-values .unit {
    font-size: 12px;
    letter-spacing: 2px;
    opacity: 0.75;
    text-transform: uppercase;
  }
  .butterfly {
    position: absolute;
    width: 70px;
    pointer-events: none;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));
  }
  .b-topright { top: -140px; right: -30px; width: 90px; transform: rotate(8deg); }
  .b-left { top: -20px; left: -55px; width: 85px; transform: rotate(-12deg); }
  .b-pink { bottom: -22px; left: -30px; width: 68px; }
  .b-blue { bottom: -22px; right: -30px; width: 68px; transform: scaleX(-1); }

  .swap-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 22px;
    color: #6a5b96;
    margin: -8px auto 18px;
    display: block;
  }
  .error {
    color: #b3003c;
    font-weight: 700;
    font-size: 14px;
    margin-top: 10px;
    min-height: 18px;
  }
  @media (max-width: 420px) {
    .butterfly { width: 55px; }
    .b-topright { width: 70px; top: -110px; }
  }
</style>
</head>
<body>
<div class="card">
  <h1>YEARS CALCULATOR</h1>

  <div class="field-wrap">
    <svg class="butterfly b-topright" viewBox="0 0 100 100">
      <g>
        <path d="M50 50 C20 10 0 20 10 50 C0 80 20 90 50 50" fill="#5ec9d9"/>
        <path d="M50 50 C80 10 100 20 90 50 C100 80 80 90 50 50" fill="#3ba8c4"/>
        <line x1="50" y1="30" x2="50" y2="70" stroke="#222" stroke-width="3"/>
      </g>
    </svg>
    <div class="field">
      <label for="prevDate">Previous date</label>
      <input type="date" id="prevDate">
    </div>
  </div>

  <div class="field-wrap">
    <svg class="butterfly b-left" viewBox="0 0 100 100">
      <g>
        <path d="M50 50 C20 10 0 20 10 50 C0 80 20 90 50 50" fill="#b98fd6"/>
        <path d="M50 50 C80 10 100 20 90 50 C100 80 80 90 50 50" fill="#d9bce8"/>
        <line x1="50" y1="30" x2="50" y2="70" stroke="#222" stroke-width="3"/>
      </g>
    </svg>
    <div class="field">
      <label for="presDate">Present date</label>
      <input type="date" id="presDate">
    </div>
  </div>

  <button class="swap-btn" onclick="swapDates()" title="Swap dates">⇅ swap</button>

  <div class="result-wrap">
    <svg class="butterfly b-pink" viewBox="0 0 100 100">
      <g>
        <path d="M50 50 C20 10 0 20 10 50 C0 80 20 90 50 50" fill="#ff6fa8"/>
        <path d="M50 50 C80 10 100 20 90 50 C100 80 80 90 50 50" fill="#ff9cc4"/>
        <line x1="50" y1="30" x2="50" y2="70" stroke="#222" stroke-width="3"/>
      </g>
    </svg>
    <svg class="butterfly b-blue" viewBox="0 0 100 100">
      <g>
        <path d="M50 50 C20 10 0 20 10 50 C0 80 20 90 50 50" fill="#8ea3ff"/>
        <path d="M50 50 C80 10 100 20 90 50 C100 80 80 90 50 50" fill="#c2ccff"/>
        <line x1="50" y1="30" x2="50" y2="70" stroke="#222" stroke-width="3"/>
      </g>
    </svg>
    <div class="result-field">
      <h2>Result</h2>
      <div class="result-values">
        <div><span class="num" id="outYears">0</span><span class="unit">Years</span></div>
        <div><span class="num" id="outMonths">0</span><span class="unit">Months</span></div>
        <div><span class="num" id="outDays">0</span><span class="unit">Days</span></div>
      </div>
    </div>
  </div>
  <div class="error" id="err"></div>
</div>

<script>
  const prevEl = document.getElementById('prevDate');
  const presEl = document.getElementById('presDate');
  const yearsOut = document.getElementById('outYears');
  const monthsOut = document.getElementById('outMonths');
  const daysOut = document.getElementById('outDays');
  const errEl = document.getElementById('err');

  function todayStr() {
    const d = new Date();
    return d.toISOString().slice(0,10);
  }
  presEl.value = todayStr();

  function calc() {
    errEl.textContent = '';
    if (!prevEl.value || !presEl.value) {
      yearsOut.textContent = '0'; monthsOut.textContent = '0'; daysOut.textContent = '0';
      return;
    }
    let start = new Date(prevEl.value + 'T00:00:00');
    let end = new Date(presEl.value + 'T00:00:00');

    if (start > end) {
      errEl.textContent = 'Previous date should be earlier than present date';
      [start, end] = [end, start];
    }

    let years = end.getFullYear() - start.getFullYear();
    let months = end.getMonth() - start.getMonth();
    let days = end.getDate() - start.getDate();

    if (days < 0) {
      months -= 1;
      const prevMonthDate = new Date(end.getFullYear(), end.getMonth(), 0);
      days += prevMonthDate.getDate();
    }
    if (months < 0) {
      years -= 1;
      months += 12;
    }

    yearsOut.textContent = years;
    monthsOut.textContent = months;
    daysOut.textContent = days;
  }

  function swapDates() {
    const tmp = prevEl.value;
    prevEl.value = presEl.value;
    presEl.value = tmp;
    calc();
  }

  prevEl.addEventListener('change', calc);
  presEl.addEventListener('change', calc);
  calc();
</script>
</body>
</html>
